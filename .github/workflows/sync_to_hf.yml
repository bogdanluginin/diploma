name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  # Дозволяє запускати скрипт вручну з вкладки Actions
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true # Якщо у тебе є великі файли (моделі, датасети)

      - name: Push to hub
        env:
          HF_TOKEN: ${{ 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 }}
        run: |
          git push --force https://YOUR_HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/bogdanlugininlpnu/tbb main
